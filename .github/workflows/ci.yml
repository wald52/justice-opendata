name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install JS deps
        run: npm install
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Lint JS
        run: npx eslint js/ --ext .js || true
      - name: Test
        run: npm test
      - name: Validate data
        run: python scripts/transform_data.py

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm run build || echo "No build"
