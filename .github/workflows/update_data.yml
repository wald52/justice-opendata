name: Mise à jour des données Open Data Justice

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Fetch raw data
        run: python scripts/fetch_data.py
        
      - name: Transform data
        run: python scripts/transform_data.py
        
      # Optionnel : regénérer la géolocalisation si juridictions.csv a changé
      # - name: Geocode juridictions
      #   run: python scripts/geocode_juridictions.py
          
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/*.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Automated data update: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin HEAD || echo "Rebase failed, continuing"
          git push
