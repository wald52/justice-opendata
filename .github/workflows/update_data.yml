name: Mise à jour des données Open Data Justice

on:
  schedule:
    # S'exécute tous les dimanches à minuit
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl
          
      - name: Fetch raw data
        run: python scripts/fetch_data.py
        
      - name: Transform data
        run: python scripts/transform_data.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Automated data update: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
